name: dbt Wizard PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Fetch full history so git can compare changes against the base branch
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap

      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.14'
      #     cache: 'pip'
      #     cache-dependency-path: 'requirements.txt'

      - name: Install dbt Wizard CLI
        run: |
          curl -fsSL https://public.cdn.getdbt.com/dbt-wizard/install/install-wizard.sh | sh
          wizard --version

      # Optional: If your project relies on compiled dbt artifacts for deep inspection
      # - name: Setup dbt & Compile
      #   working-directory: f1_dbt
      #   run: |
      #     pip install dbt-core dbt-duckdb
      #     dbt deps
      #     dbt parse

      # - name: Wizard debug
      #   id: wizard_debug
      #   run: wizard debug models

      - name: Fetch main branch
        run: git fetch origin main:main

      - name: Run dbt Wizard Review
        id: wizard_review
        run: |
          wizard review --base main -m gemini/gemini-3.5-flash > review.md
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DBT_WIZARD_MODEL: gemini/gemini-3.5-flash

      - name: Post Review Comment on Pull Request
        if: always() && hashFiles('review.md') != ''
        run: |
          if [ -s review.md ]; then
            gh pr comment "${{ github.event.pull_request.number }}" --body-file review.md
          else
            echo "No review output generated."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}